<head> 
	<title>Stress Checker</title>  

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="apple-mobile-web-app-capable" content="yes">

	<link rel="stylesheet" href="w3.css">
	<link rel="stylesheet" href="w3-colors-flat.css">

	<style>
	/* makes pages full screen */
	.body {
		margin: 0em;
	}

	.page {
		width: 100vw;
		height: 100vh;
		position: fixed;
		top: 0;
		left: -100vw;
		overflow-y: auto;
		z-index: 0;
		background-color: white;
	}

	/* show active page */
	.page:target {
		left: 0vw;
		z-index: 1;
	}

	/* image resize */
	img {
		max-width: 90%;
		max-height: 90%;
	}
	</style>
</head> 

<script>

	// stores score
	var score = 0;

	// add points
	function addPoints(points){
		score = score + points;
	}

	// show result
	function showResult(){
		var resultText = "";

		// simple result logic
		if(score <= 2){
			resultText = "Low stress";
		}
		else if(score <= 5){
			resultText = "Moderate stress";
		}
		else{
			resultText = "High stress";
		}

		// display result
		document.getElementById("result").innerHTML = resultText;
	}

</script>	

<body>

	<!-- PAGE 1 -->
	<div id="page1" class="page">
		<h1>Stress Checker</h1>

		<!-- image -->
		<img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Emoji_u1f9d0.svg">

		<p>Answer a few simple questions</p>

		<a href="#page2" class="w3-button w3-blue">Start</a>
	</div>
