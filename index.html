<!DOCTYPE html> 
<html> 
<!-- The following code has been developed by students and/or researchers of the Freshman Research Initiative DIY Diagnostics Stream at The University of Texas at Austin.  

THIS CODE SHOULD NOT BE USED TO DIAGNOSE ANY KIND OF MEDICAL CONDITION.

Authors:
Tim Riedel
Shreyashi Mishra

Goal:
Simple stress level checker

Known Issues:
Very basic scoring

-->
<head> 
<title>Stress Checker</title>  

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://www.w3schools.com/lib/w3-colors-flat.css">

<style> /* style tag */
/* makes pages full screen */
body {
	margin: 0;
}

.page {
	width: 100vw;
	height: 100vh;
	position: fixed;
	top: 0;
	left: -100vw;
	overflow-y: auto;
	z-index: 0;
	background-color: white;
}

/* show active page */
.page:target {
	left: 0vw;
	z-index: 1;
}

/* image resize */
img {
	max-width: 90%;
	max-height: 90%;
}
</style>
</head>

<script>

	// stores score
	var score = 0;

	// add points
	function addPoints(points){
		score = score + points;
	}

	// show result
	function showResult(){
		var resultText = "";

		// simple result logic
		if(score <= 2){
			resultText = "Low stress";
		}
		else if(score <= 5){
			resultText = "Moderate stress";
		}
		else{
			resultText = "High stress";
		}

		// display result
		document.getElementById("result").innerHTML = resultText;
	}

</script>	

<body>

	<!-- PAGE 1 -->
	<div id="page1" class="page">
		<h1>Stress Checker</h1>

		<!-- image -->
		<img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Emoji_u1f9d0.svg">

		<p>Answer a few simple questions</p>

		<a href="#page2" class="w3-button w3-blue">Start</a>
	</div>


	<!-- QUESTION 1 -->
	<div id="page2" class="page">
		<h2>Do you feel tired?</h2>

		<a href="#page3" onclick="addPoints(2)" class="w3-button w3-red">Yes</a>
		<a href="#page3" onclick="addPoints(0)" class="w3-button w3-green">No</a>
	</div>

	<!-- QUESTION 2 -->
	<div id="page3" class="page">
		<h2>Do you sleep well?</h2>

		<a href="#page4" onclick="addPoints(2)" class="w3-button w3-red">No</a>
		<a href="#page4" onclick="addPoints(0)" class="w3-button w3-green">Yes</a>
	</div>

	<!-- QUESTION 3 -->
	<div id="page4" class="page">
		<h2>Do you feel overwhelmed?</h2>

		<a href="#page5" onclick="addPoints(2)" class="w3-button w3-red">Yes</a>
		<a href="#page5" onclick="addPoints(0)" class="w3-button w3-green">No</a>
	</div>

	<!-- QUESTION 4 -->
	<div id="page5" class="page">
		<h2>Do you take breaks?</h2>

		<a href="#page6" onclick="addPoints(0)" class="w3-button w3-green">Yes</a>
		<a href="#page6" onclick="addPoints(2)" class="w3-button w3-red">No</a>
	</div>

	<!-- RESULT PAGE -->
	<div id="page6" class="page">
		<h2>Your Result:</h2>

		<!-- result text -->
		<p id="result"></p>

		<!-- button to calculate -->
		<button onclick="showResult()" class="w3-button w3-blue">
			See Result
		</button>

		<br><br>

		<a href="#page1" class="w3-button w3-gray">Restart</a>
	</div>

</body>
</html>
